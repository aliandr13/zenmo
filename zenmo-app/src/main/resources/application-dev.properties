# Dev profile: Actuator enabled
# Actuator: expose health and info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
zenmo.jwt.secret=test-jwt-secret-do-not-use-in-prod-12312312312424342342
# --- DB (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/zenmodb
spring.datasource.username=zenmo
spring.datasource.password=zenmo-pass
# Refresh-token cookie: allow over plain http://localhost (Safari drops Secure cookies on http)
zenmo.refresh-cookie.secure=false
# --- Auth (JWT) ---
zenmo.jwt.access-ttl-seconds=3600
zenmo.jwt.refresh-ttl-seconds=28800